name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Build, then fail if the committed dist/ differs from a fresh build (ADR 0001, decision 9).
      - run: npm run check:dist
      - run: npm run typecheck
      - run: npm run check:ui-en-dash
      - run: npm test
